name: Build and sync live demos
# Live demo builds are committed so GitHub Pages can serve them from main.
# Build gate: every demo must compile before any published demo is replaced.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-demos"
  cancel-in-progress: true

jobs:
  build-demos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Angular MapLibre POI Editor
        uses: actions/checkout@v4
        with:
          repository: gespitia/angular-maplibre-poi-editor
          ref: master
          path: angular-maplibre-poi-editor

      - name: Checkout Ask a Document
        uses: actions/checkout@v4
        with:
          repository: gespitia/ask-a-document
          ref: main
          path: ask-a-document

      - name: Checkout TalentBinder
        uses: actions/checkout@v4
        with:
          repository: gespitia/talent-binder
          ref: master
          path: talent-binder

      - name: Checkout Multi-Business Workspace
        uses: actions/checkout@v4
        with:
          repository: gespitia/multi-business-workspace
          ref: main
          path: multi-business-workspace

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Angular MapLibre POI Editor
        working-directory: angular-maplibre-poi-editor
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base-href /demos/poi-editor/

      - name: Build Ask a Document
        working-directory: ask-a-document
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build TalentBinder
        working-directory: talent-binder
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run build -- --base-href /demos/talent-binder/

      - name: Build Multi-Business Workspace
        working-directory: multi-business-workspace
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Sync built demos
        run: |
          rm -rf demos/poi-editor demos/ask-a-document demos/talent-binder demos/multi-business-workspace
          mkdir -p demos/poi-editor demos/ask-a-document demos/talent-binder demos/multi-business-workspace
          cp -R angular-maplibre-poi-editor/dist/angular-maplibre-poi-editor/browser/. demos/poi-editor/
          cp -R ask-a-document/dist/. demos/ask-a-document/
          cp -R talent-binder/dist/talent-binder/browser/. demos/talent-binder/
          cp -R multi-business-workspace/dist/. demos/multi-business-workspace/
          for demo in poi-editor ask-a-document talent-binder multi-business-workspace; do
            if [ -f "demos/$demo/index.html" ]; then
              mv "demos/$demo/index.html" "demos/$demo/app.html"
            elif [ -f "demos/$demo/index.csr.html" ]; then
              mv "demos/$demo/index.csr.html" "demos/$demo/app.html"
            else
              echo "Missing browser entrypoint for $demo"
              find "demos/$demo" -maxdepth 2 -type f | sort
              exit 1
            fi
            cat > "demos/$demo/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Gustavo Espitia · Live Demo</title>
          <style>
          :root{--bg:#e7e9e5;--ink:#27302d;--muted:#68726d;--line:#d5dad5;--accent:#766f9f}
          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
          header{height:58px;display:flex;align-items:center;padding:0 max(14px,calc((100vw - 1240px)/2));gap:20px;border-bottom:1px solid var(--line);background:rgba(231,233,229,.96);position:relative;z-index:2}
          .brand{font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}.brand span{color:var(--accent)}
          .back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:11px;letter-spacing:.06em}
          .lang{display:flex;gap:7px;font-size:10px;letter-spacing:.1em}.lang a{color:var(--muted);text-decoration:none}.lang a.active{color:var(--ink);font-weight:700}
          iframe{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#fff}
          @media(max-width:650px){header{gap:10px}.brand{font-size:12px}.back{font-size:9px}}
          </style>
          </head>
          <body>
          <header>
          <a class="brand" href="../../">GE<span>·</span> Gustavo Espitia</a>
          <a class="back" href="../../">← Back to portfolio</a>
          <div class="lang"><a class="en" href="?lang=en">EN</a><a class="es" href="?lang=es">ES</a></div>
          </header>
          <iframe src="app.html" title="Live demo"></iframe>
          <script>
          (function(){const k='gespitia-language',q=new URLSearchParams(location.search).get('lang'),v=q==='es'||q==='en'?q:(localStorage.getItem(k)||'en');localStorage.setItem(k,v);document.documentElement.lang=v;document.querySelector('.'+v)?.classList.add('active');})();
          </script>
          </body>
          </html>
          EOF
          done
          test -f demos/poi-editor/index.html
          test -f demos/ask-a-document/index.html
          test -f demos/talent-binder/index.html
          test -f demos/multi-business-workspace/index.html

      - name: Commit demo builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/poi-editor demos/ask-a-document demos/talent-binder demos/multi-business-workspace
          if git diff --cached --quiet; then
            echo "No demo changes to commit."
          else
            git commit -m "Build live demos [skip ci]"
            git push
          fi
