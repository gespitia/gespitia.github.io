<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gustavo Espitia · Live Demo</title>
<style>
:root{--bg:#e7e9e5;--ink:#27302d;--muted:#68726d;--line:#d5dad5;--accent:#766f9f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
header{height:58px;display:flex;align-items:center;padding:0 max(14px,calc((100vw - 1240px)/2));gap:18px;border-bottom:1px solid var(--line);background:rgba(231,233,229,.96);position:relative;z-index:2}
.brand{font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}.brand span{color:var(--accent)}
.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:11px;letter-spacing:.06em}
.lang{display:flex;gap:7px;font-size:10px;letter-spacing:.1em}.lang a{color:var(--muted);text-decoration:none}.lang a.active{color:var(--ink);font-weight:700}
.theme{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 10px;font:inherit;font-size:9px;letter-spacing:.06em;cursor:pointer}
iframe{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#fff}
@media(max-width:650px){header{gap:9px}.brand{font-size:12px}.back{font-size:9px}.theme{padding:6px 8px}.lang{font-size:9px}}
</style>
</head>
<body>
<header>
<a class="brand" href="../../">GE<span>·</span> Gustavo Espitia</a>
<a class="back" href="../../">← Back to portfolio</a>
<div class="lang"><a class="en" href="?lang=en">EN</a><a class="es" href="?lang=es">ES</a></div>
<button class="theme" id="theme" type="button">Theme: inherited</button>
</header>
<iframe id="demo" src="app.html?v=00a8c96a25a238a2a8b1cefb46b4dd1bd4b223d1" title="Live demo"></iframe>
<script>
(function(){
  const languageKey='gespitia-language';
  const themeKey='gespitia-demo-theme';
  const query=new URLSearchParams(location.search).get('lang');
  let language=query==='es'||query==='en'?query:(localStorage.getItem(languageKey)||'en');
  let theme=localStorage.getItem(themeKey)==='native'?'native':'inherit';
  const frame=document.getElementById('demo');
  const themeButton=document.getElementById('theme');
  const tokens={'--portfolio-bg':'#e7e9e5','--portfolio-paper':'#f0f1ee','--portfolio-ink':'#27302d','--portfolio-muted':'#68726d','--portfolio-line':'#d5dad5','--portfolio-accent':'#766f9f'};
  const target=location.origin;
  function sync(){
    localStorage.setItem(languageKey,language);
    localStorage.setItem(themeKey,theme);
    document.documentElement.lang=language;
    document.querySelectorAll('[data-lang]').forEach(a=>{a.classList.toggle('active',a.dataset.lang===language);a.setAttribute('aria-current',a.dataset.lang===language?'true':'false')});
    themeButton.textContent='Theme: '+(theme==='inherit'?'inherited':'native');
    frame.contentWindow?.postMessage({source:'gespitia-shell',type:'shell.init',language,theme,tokens},target);
  }
  document.querySelector('.en').addEventListener('click',e=>{e.preventDefault();language='en';history.replaceState(null,'','?lang=en');sync();frame.contentWindow?.postMessage({source:'gespitia-shell',type:'language.changed',language},target)});
  document.querySelector('.es').addEventListener('click',e=>{e.preventDefault();language='es';history.replaceState(null,'','?lang=es');sync();frame.contentWindow?.postMessage({source:'gespitia-shell',type:'language.changed',language},target)});
  themeButton.addEventListener('click',()=>{theme=theme==='inherit'?'native':'inherit';sync();frame.contentWindow?.postMessage({source:'gespitia-shell',type:'theme.changed',theme,tokens},target)});
  frame.addEventListener('load',sync);
  sync();
})();
</script>
</body>
</html>
