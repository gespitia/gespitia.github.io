<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espacio multi-negocio | Gustavo Espitia</title>
<meta name="description" content="Interactive product architecture demo by Gustavo Espitia: multi-business workspace, tenant isolation, modular frontend architecture and controlled AI.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ec;--paper:#fff;--ink:#202824;--muted:#68716c;--line:#d9ded9;--accent:#7169a0;--soft:#eeecf7;--green:#6f907b;--danger:#9b6f6f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.mono,.eyebrow{font:500 .62rem "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(238,240,236,.94);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;flex-wrap:nowrap}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:600;min-width:0;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}.header-actions{display:flex;align-items:center;gap:18px;flex:0 0 auto}.back{color:var(--muted)}
.hero{padding:55px 0 34px}.eyebrow{color:var(--accent);margin-bottom:12px}.hero h1{font-size:clamp(2.7rem,6vw,5.5rem);line-height:.95;letter-spacing:-.065em;margin:0;max-width:900px}.hero h1 span{color:var(--accent)}.hero p{max-width:720px;color:var(--muted);font-size:1rem;margin:22px 0 0}
.app{display:grid;grid-template-columns:220px 1fr;border:1px solid var(--line);background:var(--paper);min-height:650px;margin:25px 0 70px;box-shadow:0 18px 50px rgba(32,40,36,.07)}.sidebar{border-right:1px solid var(--line);padding:18px;background:#fafbf9}.tenant{border:1px solid var(--line);padding:12px;background:#fff;margin-bottom:22px}.tenant-label{font-size:.58rem;color:var(--muted);font-family:"DM Mono"}.tenant-select{width:100%;border:0;background:transparent;font-weight:600;padding:7px 0 2px;outline:0}.navitem{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 10px;margin:2px 0;color:var(--muted);font-size:.85rem}.navitem.active{background:var(--soft);color:var(--ink);font-weight:600}.side-note{border-top:1px solid var(--line);margin-top:25px;padding-top:18px;color:var(--muted);font-size:.7rem}
.main{padding:25px;min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:18px}.title h2{font-size:1.65rem;letter-spacing:-.04em;margin:3px 0}.title p{margin:0;color:var(--muted);font-size:.78rem}.role{font:500 .6rem "DM Mono";border:1px solid var(--line);padding:7px 9px;white-space:nowrap}.content{padding-top:23px}.view{display:none}.view.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid var(--line);padding:16px;background:#fbfcfa}.metric span{display:block;color:var(--muted);font-size:.65rem}.metric strong{display:block;font-size:1.5rem;margin-top:4px;letter-spacing:-.04em}.metric em{font-style:normal;font-size:.65rem;color:var(--green)}
.panel{border:1px solid var(--line);margin-top:10px;padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel-head h3{margin:0;font-size:.9rem}.panel-head small{color:var(--muted)}.activity{display:grid;gap:9px}.activity div{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:9px;font-size:.76rem}.activity span{color:var(--muted)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;border:1px solid var(--line);padding:10px 12px;outline:0}.primary{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:0 15px;font:500 .62rem "DM Mono"}.table{width:100%;border-collapse:collapse;font-size:.76rem}.table th{text-align:left;color:var(--muted);font:500 .58rem "DM Mono";text-transform:uppercase;padding:9px;border-bottom:1px solid var(--line)}.table td{padding:11px 9px;border-bottom:1px solid var(--line)}.status{font:500 .58rem "DM Mono";padding:4px 7px;background:#edf4ef;color:#53735f}.muted{color:var(--muted)}
.ai-box{display:grid;grid-template-columns:1fr 1fr;gap:12px}.question{background:var(--soft);border:1px solid #ddd9ee;padding:20px}.question h3{font-size:1.1rem;margin:0 0 9px}.question p{font-size:.76rem;color:var(--muted);margin:0 0 18px}.askrow{display:flex;gap:8px}.askrow input{flex:1;border:1px solid var(--line);padding:10px;background:#fff;outline:0}.answer{border:1px solid var(--line);padding:20px;min-height:180px}.answer .label{color:var(--accent);font:500 .58rem "DM Mono";text-transform:uppercase}.answer h3{font-size:1.05rem;margin:10px 0}.source{font-size:.68rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:18px}
.arch-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.arch-node{border:1px solid var(--line);padding:15px;background:#fafbf9}.arch-node strong{display:block;font-size:.72rem}.arch-node small{display:block;color:var(--muted);font-size:.62rem;margin-top:5px}.trace{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:14px}.trace span{border:1px solid var(--line);padding:6px 8px;font:500 .56rem "DM Mono";background:#fff}.trace b{color:var(--accent)}
.permissions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.permission-card{border:1px solid var(--line);padding:18px}.permission-card h3{margin:0 0 8px}.permission-card p{color:var(--muted);font-size:.74rem}.hidden-action{color:var(--muted);font-size:.72rem;border-top:1px solid var(--line);padding-top:12px}
section{padding:0 0 70px}.below{display:grid;grid-template-columns:1fr 1fr;gap:14px}.below-card{border:1px solid var(--line);background:var(--paper);padding:22px}.below-card h2{margin:3px 0 10px;font-size:1.4rem}.below-card p{color:var(--muted);font-size:.78rem}
footer{padding:0 0 50px;color:var(--muted);font-size:.7rem}
@media(max-width:800px){header{padding:0 12px}.header-actions{gap:8px}.back{font-size:11px}.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.metrics{grid-template-columns:1fr 1fr}.ai-box,.permissions,.below{grid-template-columns:1fr}.arch-mini{grid-template-columns:1fr 1fr}.main{padding:18px}.navitem{display:inline-block;width:auto}.side-note{display:none}}
.language-switch{display:flex;align-items:center;gap:6px;font:500 .62rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;margin-left:16px}.language-switch a{color:var(--muted);text-decoration:none;padding:4px 2px}.language-switch a.active{color:var(--ink);font-weight:700}.language-switch span{color:var(--line)}@media(max-width:700px){.language-switch{margin-left:8px}}.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:18px;margin-left:auto;flex:0 0 auto;white-space:nowrap}.language-switch{display:flex;align-items:center;gap:6px;font:500 .62rem "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.language-switch a{color:var(--muted);text-decoration:none;padding:4px 2px}.language-switch a.active{color:var(--ink);font-weight:700}.language-switch span{color:var(--line)}@media(max-width:700px){.header-actions{gap:8px}.back{font-size:11px}.language-switch{font-size:.56rem}}>
