<title>TalentBinder · Engineering Lab · Gustavo Espitia</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#18202a;--muted:#68717d;--line:#e4e7eb;--accent:#5b4bb7;--danger:#b42318;--shadow:0 8px 30px rgba(20,25,35,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{font-weight:750;font-size:18px}.brand span{color:var(--accent)}.back{color:var(--muted);text-decoration:none}
main{max-width:1180px;margin:32px auto;padding:0 20px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:32px;margin:6px 0}.intro{color:var(--muted);margin:0 0 26px;max-width:700px}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}.search{flex:1;position:relative}.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
button{border:0;border-radius:9px;padding:11px 16px;font:600 14px inherit;cursor:pointer;background:var(--accent);color:#fff}button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.meta{padding:14px 18px;color:var(--muted);border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#fafbfc}tr:last-child td{border-bottom:0}.name{font-weight:650}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0eefb;color:#4b3da0;font-size:12px}
.actions button{padding:7px 10px;font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:14px;width:min(560px,calc(100% - 30px));padding:0;box-shadow:0 20px 70px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(20,25,35,.35)}.modal{padding:24px}.modal h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:720px){.toolbar{flex-direction:column;align-items:stretch}.grid{grid-template-columns:1fr}table{min-width:760px}.card{overflow:auto}h1{font-size:27px}}
